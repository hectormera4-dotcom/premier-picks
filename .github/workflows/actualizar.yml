name: Actualizar picks diariamente

on:
  schedule:
    # Corre todos los dias a las 12:00 UTC (ajusta segun tu zona horaria si quieres otra hora)
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Esto permite correrlo manualmente desde GitHub cuando quieras, ademas del horario automatico

permissions:
  contents: write
  issues: write

jobs:
  actualizar-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el script de actualizacion
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python actualizar_y_predecir.py

      - name: Guardar los cambios de vuelta en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add premier_league_combinado.csv la_liga_combinado.csv serie_a_combinado.csv ligue_1_combinado.csv bundesliga_combinado.csv 2>/dev/null || true
          git add picks_del_dia_*.csv 2>/dev/null || true
          git add historial_picks_*.csv 2>/dev/null || true
          git add combinadas_del_dia.json combinadas_del_dia_*.json 2>/dev/null || true
          git add historial_combinadas.csv 2>/dev/null || true
          git add contador_fechas.json contador_fechas_*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Actualizacion automatica de picks"
          # Nos sincronizamos con lo ultimo del repositorio antes de subir,
          # por si alguien (o otra corrida del workflow) subio algo mientras
          # tanto -- esto evita el error "rejected (fetch first)".
          git pull --rebase --autostash origin main
          git push

      - name: Avisar si el pipeline fallo (crea o actualiza un Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "pipeline-fallido";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: abiertos } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: label,
            });
            if (abiertos.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: abiertos[0].number,
                body: `El pipeline volvio a fallar. Log completo: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "⚠️ El pipeline diario de picks fallo",
                body: `La corrida automatica de "Actualizar picks diariamente" fallo.\n\n` +
                      `Log completo: ${runUrl}\n\n` +
                      `Este Issue se cierra solo automaticamente en cuanto una corrida futura sea exitosa.`,
                labels: [label],
                // Asignado al dueno del repo -- asi la notificacion push del
                // celular se dispara de forma confiable (activando el tipo
                // "Asignado" en la app de GitHub), sin depender de la
                // configuracion de "watching" del repo.
                assignees: [context.repo.owner],
              });
            }

      - name: Cerrar el aviso de fallo si esta corrida SI funciono
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "pipeline-fallido";
            const { data: abiertos } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: label,
            });
            for (const issue of abiertos) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: "La siguiente corrida del pipeline fue exitosa -- cerrando este aviso automaticamente.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
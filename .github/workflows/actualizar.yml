name: Actualizar picks diariamente

on:
  schedule:
    # Corre todos los dias a las 12:00 UTC (ajusta segun tu zona horaria si quieres otra hora)
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Esto permite correrlo manualmente desde GitHub cuando quieras, ademas del horario automatico

permissions:
  contents: write

jobs:
  actualizar-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el script de actualizacion
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python actualizar_y_predecir.py

      - name: Guardar los cambios de vuelta en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add premier_league_combinado.csv la_liga_combinado.csv 2>/dev/null || true
          git add picks_del_dia_*.csv 2>/dev/null || true
          git add historial_picks_*.csv 2>/dev/null || true
          git add combinadas_del_dia_*.json 2>/dev/null || true
          git add historial_combinadas_*.csv 2>/dev/null || true
          git add contador_fechas_*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Actualizacion automatica de picks"
          # Nos sincronizamos con lo ultimo del repositorio antes de subir,
          # por si alguien (o otra corrida del workflow) subio algo mientras
          # tanto -- esto evita el error "rejected (fetch first)".
          git pull --rebase --autostash origin main
          git push
name: Actualizar picks diariamente

on:
  schedule:
    # 23:30 UTC = 18:30 hora Ecuador (UTC-5), todos los dias.
    #
    # Por que esta hora: el ultimo partido de cualquier liga activa
    # (Premier League, LaLiga, Serie A, Ligue 1, Bundesliga, Championship)
    # rara vez patea despues de las 21:00-21:45 hora local europea, lo que
    # termina como muy tarde ~23:00-23:45 CEST/CET (21:00-22:45 UTC segun
    # la epoca del año). 23:30 UTC deja margen de sobra (incluyendo tiempo
    # extra/penales) para que TODOS los partidos del dia ya esten resueltos
    # antes de correr -- asi las combinadas de hoy ya se saben si se
    # cumplieron o no, y los picks/combinadas que se generan son los del
    # dia SIGUIENTE, publicados con tiempo para hacer publicidad esa misma
    # noche/madrugada.
    - cron: '30 23 * * *'
    # Respaldo: si por lo que sea la corrida de las 23:30 UTC no se
    # dispara (GitHub documenta que su scheduler de cron es "best effort"
    # y en momentos de carga alta puede saltarse una corrida programada
    # por completo), esta segunda corrida 45 minutos despues actua como
    # red de seguridad. Correr el pipeline dos veces el mismo dia es
    # inofensivo -- todo lo que sube (picks, combinadas, historial) se
    # reemplaza/deduplica, nunca se duplica.
    - cron: '15 0 * * *'
  workflow_dispatch:
    # Esto permite correrlo manualmente desde GitHub cuando quieras, ademas del horario automatico

permissions:
  contents: write
  issues: write

jobs:
  actualizar-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer los datos mas recientes (rama datos-pipeline)
        # 'main' guarda solo CODIGO (protegido, requiere Pull Request); los
        # datos que este pipeline genera y necesita leer entre corridas
        # (historicos, historial de picks/combinadas, contadores) viven en
        # la rama 'datos-pipeline', separada -- por eso hay que traerlos
        # aqui antes de correr el script, que espera encontrarlos en el
        # working directory tal como los dejo la corrida anterior.
        run: |
          git fetch origin datos-pipeline
          git checkout origin/datos-pipeline -- 'premier_league_combinado.csv' 'la_liga_combinado.csv' 'serie_a_combinado.csv' 'ligue_1_combinado.csv' 'bundesliga_combinado.csv' 'championship_combinado.csv' 2>/dev/null || true
          git checkout origin/datos-pipeline -- 'picks_del_dia_*.csv' 2>/dev/null || true
          git checkout origin/datos-pipeline -- 'historial_picks_*.csv' 2>/dev/null || true
          git checkout origin/datos-pipeline -- 'combinadas_del_dia.json' 'combinadas_del_dia_*.json' 2>/dev/null || true
          git checkout origin/datos-pipeline -- 'historial_combinadas.csv' 2>/dev/null || true
          git checkout origin/datos-pipeline -- 'contador_fechas.json' 'contador_fechas_*.json' 2>/dev/null || true
          git checkout origin/datos-pipeline -- 'ultimo_dia_generado.json' 2>/dev/null || true

      - name: Correr el script de actualizacion
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python actualizar_y_predecir.py

      - name: Guardar los datos generados en la rama 'datos-pipeline'
        # OJO: esto sube a 'datos-pipeline', NUNCA a 'main' -- 'main' esta
        # protegida (solo acepta cambios via Pull Request, con las pruebas
        # automaticas en verde) para que ningun cambio de CODIGO llegue a
        # produccion sin revisarse. Los datos generados aqui no son codigo
        # -- la app nunca los lee directo, todo lo que ve un usuario sale
        # de Supabase -- asi que no tiene sentido, ni falta, que pasen por
        # ese mismo filtro. Viven en su propia rama sin proteger para que
        # el pipeline nunca se quede bloqueado esperando una aprobacion
        # que no le corresponde.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/datos_generados
          cp premier_league_combinado.csv la_liga_combinado.csv serie_a_combinado.csv ligue_1_combinado.csv bundesliga_combinado.csv championship_combinado.csv /tmp/datos_generados/ 2>/dev/null || true
          cp picks_del_dia_*.csv /tmp/datos_generados/ 2>/dev/null || true
          cp historial_picks_*.csv /tmp/datos_generados/ 2>/dev/null || true
          cp combinadas_del_dia.json combinadas_del_dia_*.json /tmp/datos_generados/ 2>/dev/null || true
          cp historial_combinadas.csv /tmp/datos_generados/ 2>/dev/null || true
          cp contador_fechas.json contador_fechas_*.json /tmp/datos_generados/ 2>/dev/null || true
          cp ultimo_dia_generado.json /tmp/datos_generados/ 2>/dev/null || true

          git fetch origin datos-pipeline
          git checkout -B datos-pipeline origin/datos-pipeline
          cp /tmp/datos_generados/* .

          git add premier_league_combinado.csv la_liga_combinado.csv serie_a_combinado.csv ligue_1_combinado.csv bundesliga_combinado.csv championship_combinado.csv 2>/dev/null || true
          git add picks_del_dia_*.csv 2>/dev/null || true
          git add historial_picks_*.csv 2>/dev/null || true
          git add combinadas_del_dia.json combinadas_del_dia_*.json 2>/dev/null || true
          git add historial_combinadas.csv 2>/dev/null || true
          git add contador_fechas.json contador_fechas_*.json 2>/dev/null || true
          git add ultimo_dia_generado.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No hubo cambios en los datos -- nada que subir."
            exit 0
          fi

          git commit -m "Actualizacion automatica de picks"
          git pull --rebase --autostash origin datos-pipeline
          git push origin datos-pipeline

      - name: Avisar si el pipeline fallo (crea o actualiza un Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "pipeline-fallido";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: abiertos } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: label,
            });
            if (abiertos.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: abiertos[0].number,
                body: `El pipeline volvio a fallar. Log completo: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "⚠️ El pipeline diario de picks fallo",
                body: `La corrida automatica de "Actualizar picks diariamente" fallo.\n\n` +
                      `Log completo: ${runUrl}\n\n` +
                      `Este Issue se cierra solo automaticamente en cuanto una corrida futura sea exitosa.`,
                labels: [label],
                // Asignado al dueno del repo -- asi la notificacion push del
                // celular se dispara de forma confiable (activando el tipo
                // "Asignado" en la app de GitHub), sin depender de la
                // configuracion de "watching" del repo.
                assignees: [context.repo.owner],
              });
            }

      - name: Cerrar el aviso de fallo si esta corrida SI funciono
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "pipeline-fallido";
            const { data: abiertos } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: label,
            });
            for (const issue of abiertos) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: "La siguiente corrida del pipeline fue exitosa -- cerrando este aviso automaticamente.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks FC — Pronósticos con IA</title>

<!-- PostHog: analytics de uso real (funnels, session replay). Cargamos
     el script real directamente (en vez del snippet minificado que
     normalmente recomienda PostHog) y llamamos a init() en cuanto
     termina de cargar -- mismo resultado, sin el riesgo de transcribir
     mal un bloque de codigo minificado a mano. person_profiles:
     "identified_only" evita gastar cuota en visitantes anonimos que
     nunca inician sesion. -->
<script src="https://us-assets.i.posthog.com/static/array.js"
        onload="posthog.init('phc_mRJNHufDfZEc8bxS3ZhjafXS2dGaxrLp4eiayWuoRvGD', {api_host: 'https://us.i.posthog.com', person_profiles: 'identified_only'})"></script>

<!-- Sentry: captura errores reales de JavaScript que le pasan a un
     usuario en su propio navegador, con el detalle tecnico completo,
     aunque nosotros nunca lo veamos pasar. Loader Script oficial (el DSN
     va incluido en la URL del script, no hace falta pegarlo aparte). -->
<script src="https://js.sentry-cdn.com/e07b35debd8597f0c4c7df92a6411f03.min.js" crossorigin="anonymous"></script>

<style>
  :root {
    --fondo: #16221A;
    --fondo-alt: #1F3026;
    --papel: #EFEBE2;
    --papel-alt: #E4DECF;
    --tinta: #17201A;
    --tinta-suave: #4B564C;
    --verde: #2F6E45;
    --verde-claro: #4E9868;
    --ambar: #C98A2B;
    --rojo: #A34B3E;
    --linea: rgba(23, 32, 26, 0.12);
    --linea-oscura: rgba(239, 235, 226, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--fondo);
    color: var(--papel);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .display { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.02em; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  a { color: inherit; }

  /* ---------- Header ---------- */
  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--linea-oscura);
    position: sticky;
    top: 0;
    background: var(--fondo);
    z-index: 20;
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.03em;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .logo span { color: var(--verde-claro); }
  .jornada-tag {
    font-size: 12px;
    color: rgba(239,235,226,0.55);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ---------- Autenticacion ---------- */
  .auth-barra { display: flex; align-items: center; gap: 10px; }
  .auth-estado { font-size: 12.5px; color: rgba(239,235,226,0.7); }
  .auth-estado b { color: var(--verde-claro); }
  .auth-estado-bloque { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.4; }
  .auth-vencimiento { font-size: 10.5px; color: rgba(239,235,226,0.5); }
  .auth-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--linea-oscura);
    background: transparent;
    color: rgba(239,235,226,0.75);
    cursor: pointer;
    text-transform: uppercase;
  }
  .auth-btn.destacado { background: var(--verde); border-color: var(--verde); color: #fff; }

  .btn-instalar-app {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 8px 16px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #C98A2B, #E0A73F);
    color: #17201A;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 0 rgba(201,138,43,0.6);
    animation: pulso-instalar 2.2s ease-in-out infinite;
  }
  @keyframes pulso-instalar {
    0%   { box-shadow: 0 0 0 0 rgba(201,138,43,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(201,138,43,0); }
    100% { box-shadow: 0 0 0 0 rgba(201,138,43,0); }
  }

  .auth-modal-fondo {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .auth-modal {
    background: var(--papel);
    color: var(--tinta);
    border-radius: 10px;
    padding: 24px;
    width: 300px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .auth-modal-titulo {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .auth-input {
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--linea);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .auth-error { font-size: 12px; color: var(--rojo); min-height: 14px; }

  .banner-vip {
    background: linear-gradient(135deg, #2A4433 0%, #1F3327 100%);
    border: 1px solid rgba(201,138,43,0.4);
    border-radius: 8px;
    padding: 16px 20px;
    margin: 22px 0 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .banner-vip-titulo {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ambar);
    margin-bottom: 3px;
  }
  .banner-vip-texto { font-size: 12.5px; color: rgba(239,235,226,0.8); }
  .auth-btn-google {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px 12px;
    border-radius: 6px; border: 1px solid var(--linea);
    background: #fff; color: #3c4043;
    font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600;
    cursor: pointer;
  }
  .auth-separador {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--tinta-suave); text-transform: uppercase;
  }
  .auth-separador::before, .auth-separador::after { content: ""; flex: 1; height: 1px; background: var(--linea); }
  .combinada-vip-preview { border-color: rgba(201,138,43,0.35); }


  /* ---------- Marcador global de confianza ---------- */
  .marcador-global {
    max-width: 960px;
    margin: 24px auto 0;
    padding: 0 20px;
  }
  .marcador-box {
    background: var(--fondo-alt);
    border: 1px solid var(--linea-oscura);
    border-radius: 6px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .marcador-numero {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 40px;
    color: var(--verde-claro);
    line-height: 1;
  }
  .marcador-texto {
    font-size: 13px;
    color: rgba(239,235,226,0.7);
    max-width: 420px;
  }
  .marcador-texto strong { color: var(--papel); }
  .marcador-link {
    margin-left: auto;
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 3px;
    color: rgba(239,235,226,0.6);
    white-space: nowrap;
  }
  .etiqueta-fecha-picks {
    max-width: 960px;
    margin: 18px auto 14px;
    padding: 0 20px;
    text-align: center;
  }
  .etiqueta-fecha-picks span {
    display: inline-block;
    background: rgba(78,152,104,0.15);
    border: 1px solid rgba(78,152,104,0.4);
    color: var(--verde-claro);
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    letter-spacing: 0.2px;
  }

  /* ---------- Tabs ---------- */
  /* ---------- Navegacion principal (Picks / Historial) ---------- */
  /* ---------- Boton de menu (hamburguesa) ---------- */
  .btn-menu {
    background: transparent; border: none; color: var(--papel);
    cursor: pointer; padding: 6px; display: flex; align-items: center;
  }

  /* ---------- Menu lateral ---------- */
  .fondo-menu-lateral {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .fondo-menu-lateral.visible { opacity: 1; pointer-events: auto; }

  .menu-lateral {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 300px; max-width: 85vw;
    background: var(--fondo-alt);
    border-right: 1px solid var(--linea-oscura);
    z-index: 91;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .menu-lateral.abierto { transform: translateX(0); }

  .menu-lateral-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 16px; border-bottom: 1px solid var(--linea-oscura);
  }
  .btn-cerrar-menu {
    background: transparent; border: none; color: rgba(239,235,226,0.6);
    font-size: 18px; cursor: pointer; padding: 4px 8px;
  }

  .menu-lateral-nav { padding: 14px 12px; flex: 1; }
  .menu-item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: none; color: var(--papel);
    font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 500;
    padding: 12px 12px; border-radius: 6px; cursor: pointer;
    margin-bottom: 2px;
  }
  .menu-item.activo { background: rgba(78,152,104,0.18); color: var(--verde-claro); }
  .menu-item:hover { background: rgba(255,255,255,0.05); }

  .submenu-ligas { padding: 4px 4px 10px 8px; }
  .grid-ligas {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;
  }
  .liga-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--linea-oscura);
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    position: relative;
  }
  .liga-box.liga-activa-seleccionada { border-color: var(--verde-claro); background: rgba(78,152,104,0.12); }
  .liga-box.liga-proximamente { cursor: default; opacity: 0.55; }
  .liga-escudo {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 700;
    margin: 0 auto 6px;
  }
  .liga-nombre { font-size: 11px; color: rgba(239,235,226,0.85); line-height: 1.2; }
  .liga-badge-proximamente {
    font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--ambar); margin-top: 4px;
  }

  /* ---------- Vista de liga (posiciones, goleadores, novedades) ---------- */
  .liga-header-vista {
    max-width: 960px; margin: 26px auto 10px; padding: 0 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .liga-escudo-grande { width: 46px; height: 46px; font-size: 13px; flex-shrink: 0; }
  .liga-header-vista h2 {
    font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; margin: 0;
  }
  .seccion-liga { margin: 28px 0; }
  .seccion-liga-titulo {
    font-family: 'Oswald', sans-serif; font-size: 15px; letter-spacing: 0.03em;
    color: var(--verde-claro); margin: 0 0 12px;
  }
  .cargando-liga {
    color: rgba(239,235,226,0.5); font-size: 13px;
    padding: 16px; background: rgba(255,255,255,0.03); border-radius: 8px;
  }
  .tabla-liga {
    width: 100%; border-collapse: collapse;
    background: rgba(255,255,255,0.03); border-radius: 8px; overflow: hidden;
    font-size: 13px;
  }
  .tabla-liga th {
    text-align: left; padding: 10px 10px; font-family: 'Oswald', sans-serif;
    font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase;
    color: rgba(239,235,226,0.5); border-bottom: 1px solid var(--linea-oscura);
  }
  .tabla-liga td {
    padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .celda-equipo { display: flex; align-items: center; gap: 8px; }
  .celda-equipo img { width: 18px; height: 18px; object-fit: contain; }

  .lista-partidos { display: flex; flex-direction: column; gap: 6px; }
  .partido-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.03); border-radius: 8px; padding: 10px 14px;
    gap: 10px; flex-wrap: wrap;
  }
  .partido-fecha { font-size: 11px; color: rgba(239,235,226,0.5); white-space: nowrap; }
  .partido-equipos {
    display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600;
    flex: 1; justify-content: flex-end;
  }
  .partido-equipos span { display: flex; align-items: center; gap: 5px; }
  .partido-escudo { width: 16px; height: 16px; object-fit: contain; }
  .partido-marcador {
    font-family: 'Oswald', sans-serif; color: var(--verde-claro);
    background: rgba(78,152,104,0.15); padding: 2px 8px; border-radius: 4px;
  }
  .partido-vs-mini { color: rgba(239,235,226,0.4); font-weight: 400; font-size: 11px; }

  .menu-lateral-footer {
    padding: 16px; border-top: 1px solid var(--linea-oscura);
    position: sticky; bottom: 0;
    background: var(--fondo-alt);
    z-index: 2;
  }
  .menu-usuario-email { font-size: 12.5px; color: rgba(239,235,226,0.8); word-break: break-all; }
  .menu-usuario-etiqueta { font-size: 11px; color: var(--verde-claro); margin: 2px 0 4px; }
  .menu-usuario-vencimiento { font-size: 11px; color: rgba(239,235,226,0.6); margin: 0 0 10px; }
  .btn-cerrar-sesion {
    width: 100%;
    background: rgba(163,75,62,0.15);
    border: 1px solid var(--rojo);
    color: var(--rojo);
    font-family: 'Oswald', sans-serif;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    padding: 9px;
    border-radius: 6px;
    cursor: pointer;
  }


  /* ---------- Historial de combinadas por fecha ---------- */
  .fecha-grupo {
    max-width: 960px;
    margin: 0 auto 22px;
    padding: 0 20px;
  }
  .fecha-titulo {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(239,235,226,0.75);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--linea-oscura);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .fecha-titulo:hover { background: rgba(255,255,255,0.07); }
  .fecha-titulo-resumen { font-size: 11px; letter-spacing: 0.02em; text-transform: none; color: rgba(239,235,226,0.5); }
  .fecha-titulo-flecha { transition: transform 0.15s ease; }
  .fecha-grupo.abierto .fecha-titulo-flecha { transform: rotate(180deg); }
  .fecha-combinadas { display: none; }
  .fecha-grupo.abierto .fecha-combinadas { display: block; }
  .combinada-card {
    background: var(--papel);
    color: var(--tinta);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .combinada-card.pendiente { opacity: 0.75; }
  .icono-resultado {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    font-weight: 700;
  }
  .icono-cumplida { background: rgba(47,110,69,0.15); color: var(--verde); }
  .icono-fallada { background: rgba(163,75,62,0.15); color: var(--rojo); }
  .icono-pendiente { background: rgba(23,32,26,0.08); color: var(--tinta-suave); }
  .combinada-detalle { flex: 1; min-width: 0; }
  .combinada-partidos-mini {
    font-size: 12.5px;
    color: var(--tinta-suave);
    line-height: 1.5;
  }
  .combinada-partidos-mini b { color: var(--tinta); }
  .combinada-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .badge-tipo {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    background: rgba(23,32,26,0.08);
    color: var(--tinta-suave);
  }
  .cuota-mini { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--tinta-suave); }
  .vacio { text-align: center; padding: 60px 20px; color: rgba(239,235,226,0.5); font-size: 14px; }

  .tabs {
    max-width: 960px;
    margin: 22px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 8px;
  }
  .tab {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid var(--linea-oscura);
    background: transparent;
    color: rgba(239,235,226,0.65);
    cursor: pointer;
    text-transform: uppercase;
  }
  .tab.activo {
    background: var(--verde);
    border-color: var(--verde);
    color: #fff;
  }

  /* ---------- Grid de partidos ---------- */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 22px 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--papel);
    color: var(--tinta);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .card.bloqueada { color: var(--tinta); }

  .card-top {
    padding: 16px 18px 14px;
    border-bottom: 1px dashed var(--linea);
  }
  .card-fecha {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    margin-bottom: 8px;
  }
  .card-liga-badge {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--verde-claro);
    background: rgba(78,152,104,0.15);
    border-radius: 4px;
    padding: 2px 6px;
    margin-left: 6px;
  }
  .combinada-liga-badge {
    color: rgba(239,235,226,0.6);
    background: rgba(255,255,255,0.06);
    margin-left: 4px;
  }
  .card-equipos {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 17px;
  }
  .card-equipos .vs {
    font-size: 11px;
    color: var(--tinta-suave);
    font-family: 'Inter', sans-serif;
    padding: 0 8px;
  }

  .card-body {
    padding: 16px 18px 18px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex: 1;
  }

  /* --- Medidor de confianza (elemento distintivo) --- */
  .gauge-wrap {
    width: 84px;
    flex-shrink: 0;
    text-align: center;
  }
  .gauge-numero {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 19px;
    margin-top: -46px;
    display: block;
  }
  .gauge-label {
    font-size: 9px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    margin-top: 2px;
  }

  .card-info { flex: 1; min-width: 0; }
  .pick-nombre {
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .pick-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .badge {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
  }

<script>
// ---------- Conexion a Supabase ----------
// Reemplaza estos dos valores con los tuyos (Settings -> API Keys en Supabase).
// La Publishable key es segura para el navegador siempre que RLS este activo.
const SUPABASE_URL = "https://vkmugemzjvgucdmbkgvj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ROY7OYSprRvhtZJGGyqNEg_eV2PPAh0";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let sesionActual = null;
let perfilActual = null;

const UMBRAL_SEGURO = 0.80; // debe coincidir con el umbral usado en el pipeline

const ETIQUETAS_MERCADOS = {
  prob_local: "1X2 — Local gana",
  prob_empate: "1X2 — Empate",
  prob_visitante: "1X2 — Visitante gana",
  "doble_op_1X": "Doble oportunidad 1X",
  "doble_op_X2": "Doble oportunidad X2",

  btts_no: "Ambos anotan - No",
  over_25: "Over 2.5 goles",
  under_25: "Under 2.5 goles",
};

const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES_LARGO = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

// Formatea una fecha (string ISO o Date) como "10 de septiembre de 2026",
// usado para mostrarle al usuario hasta cuando le dura su suscripcion VIP.
function formatearFechaLarga(fechaStr) {
  const f = new Date(fechaStr);
  if (isNaN(f)) return "";
  return `${f.getDate()} de ${MESES_LARGO[f.getMonth()]} de ${f.getFullYear()}`;
}

function formatearFecha(fechaStr) {
  const f = new Date(String(fechaStr).replace(" ", "T"));
  if (isNaN(f)) return fechaStr;
  const hh = String(f.getHours()).padStart(2, "0");
  const mm = String(f.getMinutes()).padStart(2, "0");
  return `${DIAS[f.getDay()]} ${f.getDate()} ${MESES[f.getMonth()]} · ${hh}:${mm}`;
}

function transformarPick(fila) {
  const esGratis = !!fila.es_gratis;
  // "tieneDatos" = de verdad llegaron el pick/probabilidad/cuota (porque el
  // pick es gratis, O porque el usuario actual es VIP/admin y la vista de
  // Supabase decidio mostrarselos). Esto es distinto de "esGratis": un pick
  // VIP puede "tieneDatos = true" para un usuario VIP, aunque esGratis siga
  // siendo false (para seguir mostrando la etiqueta VIP correctamente).
  const tieneDatos = fila.pick_recomendado !== null && fila.pick_recomendado !== undefined;
  const seguro = !!fila.pick_es_seguro;
  const mercadosObj = fila.mercados_json || {};
  const mercados = Object.entries(ETIQUETAS_MERCADOS)
    .filter(([col]) => mercadosObj[col] !== undefined && mercadosObj[col] !== null)
    .map(([col, etiqueta]) => [etiqueta, `${mercadosObj[col]}%`]);

  return {
    fecha: formatearFecha(fila.fecha),
    local: fila.local, visitante: fila.visitante,
    esGratis, tieneDatos, seguro,
    pick: tieneDatos ? fila.pick_recomendado : null,
    prob: tieneDatos ? Math.round(fila.pick_probabilidad) : null,
    cuota: tieneDatos ? fila.pick_cuota_aprox : null,
    nivel: tieneDatos && seguro ? "seguro" : null,
    combo: !!fila.es_combo,
    liga: fila.liga,
    ligaMostrar: nombreLiga(fila.liga),
    mercados,
  };
}

// Escapa texto antes de insertarlo en innerHTML -- se usa en cualquier
// dato que venga directo del usuario (ej. su propio correo), para que un
// correo con caracteres especiales nunca pueda inyectar HTML/JS en su
// propia sesion.
function escaparHtml(texto) {
  const div = document.createElement("div");
  div.textContent = String(texto ?? "");
  return div.innerHTML;
}

function nombreLiga(clave) {
  const encontrada = LIGAS_DISPONIBLES.find(l => l.clave === clave);
  return encontrada ? encontrada.nombre : (clave === "mixta" ? "Varias ligas" : "");
}

// ---------- Autenticacion ----------

async function actualizarSesion() {
  const { data: { session } } = await sb.auth.getSession();
  await aplicarSesion(session);
}

async function aplicarSesion(session) {
  sesionActual = session;

  if (session) {
    // Usamos maybeSingle (no single): si el perfil todavia no existe
    // (el trigger de creacion puede tardar una fraccion de segundo la
    // primera vez que alguien se registra), esto devuelve null en vez
    // de lanzar un error 406.
    let { data: perfil } = await sb.from("perfiles").select("*").eq("id", session.user.id).maybeSingle();

    // Si es la primera vez y el trigger todavia no termino, reintentamos
    // una vez mas tras una pausa corta antes de rendirnos.
    if (!perfil) {
      await new Promise(r => setTimeout(r, 800));
      const reintento = await sb.from("perfiles").select("*").eq("id", session.user.id).maybeSingle();
      perfil = reintento.data;
    }
    perfilActual = perfil;
    // Vinculamos los eventos de PostHog a este usuario real (en vez de
    // quedar como visitante anonimo) -- asi los funnels de conversion a
    // VIP se pueden ver por usuario, no solo como numeros sueltos.
    if (window.posthog) posthog.identify(session.user.id, { email: session.user.email });
  } else {
    perfilActual = null;
  }
  renderBarraAuth();
}

// ---------- Notificaciones push (combinadas resueltas) ----------
// La llave publica NO es secreta -- esta pensada para vivir en el
// frontend (el navegador la necesita para poder suscribirse). La llave
// PRIVADA que la empareja vive solo en el backend (variable de entorno
// VAPID_PRIVATE_KEY), nunca en este archivo.
const VAPID_PUBLIC_KEY = "BKIIl39Ep2GzhTy_D5XEsN7POQaX5oilAkV2zLwQyhACrKyaJB6MZGHIeGVI_aap6baQuRpCKo8Mzg01sq9FagU";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

// Un solo texto, reutilizado en el banner de la portada y en la ventana
// explicativa antes del permiso -- para no repetirlo distinto en 2 lados.
const TEXTO_NOTIFICACIONES = "Activa las notificaciones para avisarte apenas los picks y combinadas del día ya estén disponibles.";

function renderBotonNotificaciones() {
  const boton = document.getElementById("menu-notificaciones");
  if (!boton) return;
  const activadas = localStorage.getItem("picksfc_notificaciones_activadas") === "1";
  boton.innerHTML = activadas ? "🔕 Desactivar notificaciones" : "🔔 Activar notificaciones";
}

function renderBannerNotificaciones() {
  const cont = document.getElementById("banner-notificaciones-contenedor");
  if (!cont) return;
  const activadas = localStorage.getItem("picksfc_notificaciones_activadas") === "1";
  if (activadas) { cont.innerHTML = ""; return; }
  cont.innerHTML = `
    <div class="banner-vip" style="border-color: rgba(78,152,104,0.4);">
      <div class="banner-vip-texto">
        <div class="banner-vip-titulo">🔔 Entérate cuando salgan los picks del día</div>
      </div>
      <button class="btn-vip" onclick="activarNotificaciones()">Activar notificaciones</button>
    </div>
  `;
}

function activarNotificaciones() {
  // Si ya estaban activadas, este mismo boton/banner sirve para
  // desactivarlas -- no tiene sentido volver a mostrarle la explicacion
  // de "por que activarlas" a alguien que ya las activo.
  if (localStorage.getItem("picksfc_notificaciones_activadas") === "1") {
    desactivarNotificaciones();
    return;
  }

  // Antes de pedir el permiso del navegador (generico, sin contexto --
  // por eso mucha gente lo rechaza pensando que es publicidad), le
  // explicamos primero para que sirve especificamente en esta app. Esto
  // mejora bastante cuantos usuarios terminan aceptando de verdad.
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    alert("Tu navegador no soporta notificaciones push.");
    return;
  }
  const html = `
    <div class="auth-modal-fondo" onclick="cerrarModalNotificaciones(event)">
      <div class="auth-modal" onclick="event.stopPropagation()">
        <div class="auth-modal-titulo">🔔 Entérate cuando salgan los picks del día</div>
        <div style="font-size:13.5px; line-height:1.5;">${TEXTO_NOTIFICACIONES}</div>
        <button class="auth-btn destacado" style="width:100%; margin-top:8px;" onclick="cerrarModalNotificaciones(); confirmarActivarNotificaciones();">Sí, avísame</button>
        <button class="auth-btn" style="width:100%; background:transparent; border-color:var(--linea); color:var(--tinta);" onclick="cerrarModalNotificaciones()">Ahora no</button>
      </div>
    </div>`;
  document.body.insertAdjacentHTML("beforeend", html);
}

function cerrarModalNotificaciones(event) {
  if (event && event.target !== event.currentTarget) return;
  document.querySelector(".auth-modal-fondo")?.remove();
}

async function confirmarActivarNotificaciones() {
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== "granted") {
      alert("No se activaron las notificaciones -- necesitas dar permiso desde tu navegador.");
      return;
    }

    const registro = await navigator.serviceWorker.ready;
    let suscripcion = await registro.pushManager.getSubscription();
    if (!suscripcion) {
      suscripcion = await registro.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }

    const suscripcionJson = suscripcion.toJSON();
    // Usamos el cliente de Supabase (igual que el resto de la app) en vez
    // de un fetch a mano -- si ya existe esa misma suscripcion (endpoint
    // repetido), el error 23505 (llave duplicada) NO es un fallo real,
    // solo significa que este dispositivo ya estaba suscrito.
    const { error } = await sb.from("push_subscripciones").insert({
      endpoint: suscripcionJson.endpoint,
      suscripcion_json: suscripcionJson,
    });

    if (!error || error.code === "23505") {
      localStorage.setItem("picksfc_notificaciones_activadas", "1");
      alert("¡Listo! Te vamos a avisar apenas estén disponibles los picks del día.");
    } else {
      console.error(error);
      alert("No se pudo activar la notificación. Intenta de nuevo más tarde.");
    }
  } catch (err) {
    console.error(err);
    alert("Error al activar notificaciones: " + err.message);
  } finally {
    renderBotonNotificaciones();
    renderBannerNotificaciones();
  }
}

async function desactivarNotificaciones() {
  try {
    if ("serviceWorker" in navigator) {
      const registro = await navigator.serviceWorker.ready;
      const suscripcion = await registro.pushManager.getSubscription();
      if (suscripcion) await suscripcion.unsubscribe();
      // La fila en Supabase no hace falta borrarla desde aqui -- el
      // navegador ya no la reconoce como valida, y revisar_combinadas_en_vivo.py
      // la borra solo la proxima vez que intente mandarle un push y la
      // reciba como vencida (esto evita tener que darle permiso al
      // navegador para borrar filas ajenas en la base de datos).
    }
    localStorage.removeItem("picksfc_notificaciones_activadas");
    alert("Notificaciones desactivadas.");
  } catch (err) {

function vipVigente(perfil) {
  // Misma logica que la funcion SQL es_usuario_vip_o_admin(): admin, o
  // vip_hasta todavia no vencio. NO usamos el booleano perfil.es_vip solo
  // -- ese campo se pone en true al pagar y JAMAS se vuelve a poner en
  // false cuando la suscripcion vence, asi que por si solo queda "pegado"
  // en VIP para siempre despues del primer pago. vip_hasta es la unica
  // fuente de verdad real sobre si la suscripcion sigue activa.
  if (!perfil) return false;
  if (perfil.es_admin) return true;
  return !!(perfil.vip_hasta && new Date(perfil.vip_hasta) > new Date());
}

}

// ---------- Carga de datos reales desde Supabase (protegidos por RLS) ----------

async function cargarTodo() {
  try {
    const [{ data: picksRaw }, { data: combinadasRaw }, { data: historialRaw }] = await Promise.all([
      sb.from("picks_publicos").select("*"),
      sb.from("combinadas_publicas").select("*"),
      sb.from("historial_combinadas_publico").select("*").not("resultado", "is", null),
    ]);

    const picks = (picksRaw || []).map(transformarPick);
    const combinadas = (combinadasRaw || []).map(c => ({
      nombre: c.nombre, es_gratis: c.es_gratis,
      cuota_combinada: c.cuota_combinada,
      partidos: c.partidos_json,
    }));

    const resueltas = (historialRaw || []).filter(h => h.resultado === "Cumplida" || h.resultado === "Fallada");
    let porcentaje = null;
    if (resueltas.length > 0) {
      const cumplidas = resueltas.filter(h => h.resultado === "Cumplida").length;
      porcentaje = Math.round((cumplidas / resueltas.length) * 100);
    }

    renderMarcadorGlobal(porcentaje, resueltas.length);
    actualizarEtiquetaFecha(picksRaw || [], combinadasRaw || []);
    render(picks, combinadas);
    window._historialCombinadasCache = historialRaw || [];
  } catch (err) {
    document.getElementById("grid").innerHTML = `
      <div class="combinada" style="grid-column:1/-1; text-align:center; opacity:0.7;">
        No se pudieron cargar los picks todavía. Verifica que SUPABASE_URL y SUPABASE_ANON_KEY
        esten configurados correctamente, o espera a que el pipeline corra por primera vez.
      </div>`;
    console.error(err);
  }
}

// Le muestra al usuario a que fecha de partidos pertenecen los picks y
// combinadas que esta viendo (la fecha del partido MAS TEMPRANO entre
// todos los que se estan mostrando) -- para que sepa si son de hoy, de
// manana, o de un dia anterior si por alguna razon el pipeline no corrio.
function actualizarEtiquetaFecha(picksRaw, combinadasRaw) {
  const cont = document.getElementById("etiqueta-fecha-picks");
  if (!cont) return;

  const fechas = [];
  for (const p of picksRaw) {
    if (p.fecha) fechas.push(new Date(String(p.fecha).replace(" ", "T")));
  }
  for (const c of combinadasRaw) {
    for (const p of (c.partidos_json || [])) {
      if (p.fecha) fechas.push(new Date(String(p.fecha).replace(" ", "T")));
    }
  }
  const validas = fechas.filter(f => !isNaN(f));
  if (validas.length === 0) { cont.innerHTML = ""; return; }

  const masTemprana = new Date(Math.min(...validas.map(f => f.getTime())));

  const hoy = new Date();
  const soloFecha = (f) => new Date(f.getFullYear(), f.getMonth(), f.getDate()).getTime();
  const diffDias = Math.round((soloFecha(masTemprana) - soloFecha(hoy)) / 86400000);

  const DIAS_LARGO = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const fechaTexto = `${DIAS_LARGO[masTemprana.getDay()]} ${masTemprana.getDate()} de ${MESES_LARGO[masTemprana.getMonth()]}`;

  const fechaCapitalizada = fechaTexto.replace(/(^|de )([a-záéíóú])/g, (m, p1, p2) => p1 + p2.toUpperCase());

  let etiqueta;
  if (diffDias === 0) etiqueta = `📅 Combinadas para hoy ${fechaCapitalizada}`;
  else if (diffDias === 1) etiqueta = `📅 Combinadas para mañana ${fechaCapitalizada}`;
  else if (diffDias === -1) etiqueta = `📅 Combinadas de ayer ${fechaCapitalizada}`;
  else etiqueta = `📅 Combinadas para el ${fechaCapitalizada}`;

  cont.innerHTML = `<span>${etiqueta}</span>`;
}

// Umbral minimo de acierto (sobre combinadas resueltas) para mostrar el
// "Track record verificable" en la app. Por debajo de esto, la seccion se

// bajo por pura estadistica de muestra chica (una combinada de varias
// patas falla completa si UNA sola pata falla, aunque el resto acierte),
// y mostrarlo asi genera desconfianza en usuarios nuevos sin contexto.
// En cuanto el acierto real suba de este umbral, la seccion vuelve a
// aparecer automaticamente, sin que haya que tocar codigo de nuevo.

        </div>

async function iniciarPagoVip(boton, plan) {
  const textoOriginal = boton.textContent;
  boton.disabled = true;
  boton.textContent = "Preparando pago...";
  if (window.posthog) posthog.capture("vip_boton_clickeado", { plan });

  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { alert("Tu sesión expiró, inicia sesión de nuevo."); return; }

    const resp = await fetch(`${SUPABASE_URL}/functions/v1/payphone-prepare`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ plan }),
    });
    const data = await resp.json();

    if (!resp.ok || data.error) {
      if (window.posthog) posthog.capture("vip_pago_error_preparar", { plan, error: data.error || "desconocido" });
      alert("No se pudo iniciar el pago: " + (data.error || "Error desconocido"));
      boton.disabled = false;
      boton.textContent = textoOriginal;
      return;
    }

    if (window.posthog) posthog.capture("vip_pago_preparado", { plan });
    // Redirigimos al formulario de pago de Payphone (tarjeta directa)
    window.location.href = data.payWithCard;
  } catch (err) {
    if (window.posthog) posthog.capture("vip_pago_error_preparar", { plan, error: err.message });
    alert("Error al conectar con el sistema de pagos: " + err.message);
    boton.disabled = false;
    boton.textContent = textoOriginal;
  }
}

function crearCombinada(c) {
  // "desbloqueada" = de verdad llegaron los picks completos de cada
  // partido (porque es gratis, o porque el usuario actual es VIP/admin).
  // Ya NO se puede usar la presencia de cuota_combinada para esto -- desde
  // que la vista de Supabase manda la cuota SIEMPRE (aunque la combinada
  // este bloqueada), para que el usuario no-VIP la vea como "anzuelo" de
  // venta. Lo que si sigue viniendo null cuando esta bloqueada es el pick
  // recomendado de cada partido.
  const desbloqueada = c.partidos.length > 0 && c.partidos[0].pick_recomendado !== undefined && c.partidos[0].pick_recomendado !== null;
  const hayCuota = c.cuota_combinada !== null && c.cuota_combinada !== undefined;

  const filas = c.partidos.map(p => `
    <div class="combinada-fila">
      ${desbloqueada ? `<span class="prob-mini">${Math.round(p.pick_probabilidad)}%</span>` : ""}
      <span><b>${p.local} vs ${p.visitante}</b>${desbloqueada ? ` — ${p.pick_recomendado}` : ""}
        ${desbloqueada ? `<span class="card-liga-badge combinada-liga-badge">${nombreLiga(p.liga)}</span>` : ""}
      </span>
    </div>
  `).join("");

  let pie;
  if (desbloqueada) {
    pie = `
      <div class="combinada-footer">
        <span class="combinada-cuota-label">cuota estimada</span>
        <span class="combinada-cuota">${c.cuota_combinada}</span>
      </div>`;
  } else if (hayCuota) {
    // "Anzuelo" de venta: el usuario ve la cuota real que se esta
    // perdiendo (le da algo concreto que ganar si paga la membresia),
    // pero los partidos y picks individuales siguen tapados.
    pie = `
      <div class="combinada-footer">
        <span class="combinada-cuota-label">cuota estimada</span>
        <span class="combinada-cuota">${c.cuota_combinada}</span>
      </div>`;
  } else {
    pie = `
      <div class="combinada-footer" style="justify-content:center;">
        <span class="lock-texto" style="max-width:none; text-align:center;">🔒 Picks y cuota visibles solo para VIP</span>
      </div>`;
  }

  return `
    <div class="combinada ${desbloqueada ? 'gratis' : 'combinada-vip-preview'}">
      <div class="combinada-header">
        <span class="combinada-titulo">${c.nombre}</span>
        <span class="badge-mini ${c.es_gratis ? 'gratis' : 'vip'}">${c.es_gratis ? 'Gratis' : '🔒 VIP'}</span>
      </div>
      <div class="combinada-partidos">${filas}</div>
      ${pie}
    </div>
  `;
}

function crearGauge(prob, nivel) {
  const color = nivel === "seguro" ? "#2F6E45" : (nivel === "moderado" ? "#C98A2B" : "#A34B3E");
  const r = 30, circ = Math.PI * r; // medio circulo
  const offset = circ - (circ * prob / 100);
  return `
    <svg width="84" height="52" viewBox="0 0 84 52">
      <path d="M 6 46 A ${r} ${r} 0 0 1 78 46" fill="none" stroke="rgba(23,32,26,0.1)" stroke-width="7" stroke-linecap="round"/>
      <path d="M 6 46 A ${r} ${r} 0 0 1 78 46" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
    </svg>
    <span class="gauge-numero" style="color:${color}">${prob}%</span>
    <div class="gauge-label">confianza</div>
  `;
}

        <div class="card-body">
          <div class="card-info">
            <div class="sin-pick-texto">Partido parejo — ningún mercado alcanza nuestro estándar de seguridad esta fecha.</div>
          </div>
        </div>
        <button class="card-toggle" onclick="toggleDetalle(${i})">Ver probabilidades de todas formas ▾</button>
        <div class="card-detalle" id="detalle-${i}">${detalleFilas}</div>
      </div>
    `;
  }

  // Caso 3: gratis y con pick recomendado -- tarjeta completa normal.
  const badgeClase = p.nivel === "seguro" ? "badge-seguro" : "badge-moderado";
  const badgeTexto = p.nivel === "seguro" ? "Muy seguro" : "Moderado";
  const comboBadge = p.combo ? `<span class="badge badge-combo">Combo x2</span>` : "";

  return `
    <div class="card">
      <div class="card-top">
        <div class="card-fecha">${p.fecha} <span class="card-liga-badge">${p.ligaMostrar}</span></div>
        <div class="card-equipos">
          <span>${p.local}</span><span class="vs">vs</span><span>${p.visitante}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="gauge-wrap">${crearGauge(p.prob, p.nivel)}</div>
        <div class="card-info">
          <div class="pick-nombre">${p.pick}</div>
          <div class="pick-meta">
            <span class="badge ${badgeClase}">${badgeTexto}</span>
            ${comboBadge}
            <span class="cuota">cuota ~${p.cuota}</span>
          </div>
        </div>
      </div>
      <button class="card-toggle" onclick="toggleDetalle(${i})">Ver todos los mercados ▾</button>
      <div class="card-detalle" id="detalle-${i}">${detalleFilas}</div>
    </div>
  `;
}

function render(picks, combinadas) {
  document.getElementById("banner-vencimiento-vip-contenedor").innerHTML = crearBannerVencimientoVip();
  document.getElementById("banner-vip-contenedor").innerHTML = crearBannerVip();
  renderBannerNotificaciones();

  const hayPicks = picks.length > 0;
  const hayCombinadas = combinadas.length > 0;

  if (!hayPicks && !hayCombinadas) {
    // No hay ningun partido programado hoy en ninguna liga activa -- esto
    // es normal (no todos los dias hay partidos), no un error.
    document.getElementById("grid").innerHTML = `
      <div class="combinada" style="grid-column:1/-1; opacity:0.7; align-items:center; justify-content:center; text-align:center; padding:40px 20px;">
        <span class="sin-pick-texto">⚽ Hoy no hay partidos programados en tus ligas activas.<br>Vuelve más tarde o revisa el calendario de cada liga en el menú.</span>
      </div>`;
    return;
  }

  const combinadasHtml = combinadas.map(crearCombinada).join("");

  let avisoVip = "";
  if (!hayCombinadas) {
    avisoVip = `
      <div class="combinada" style="opacity:0.6; align-items:center; justify-content:center; text-align:center;">
        <span class="sin-pick-texto">Esta fecha no hay suficientes picks seguros para armar una combinada. Revisa los picks individuales abajo.</span>
      </div>`;
  }

  document.getElementById("grid").innerHTML = combinadasHtml + avisoVip + picks.map(crearTarjeta).join("");
}

function toggleDetalle(i) {
  document.getElementById(`detalle-${i}`).classList.toggle("abierto");
}

// ---------- Pestaña de Historial ----------

let historialYaCargado = false;

// ---------- Menu lateral ----------

const LIGAS_DISPONIBLES = [
  { clave: "premier_league", nombre: "Premier League", abrev: "PL", color: "#3D195B", activa: true },
  { clave: "la_liga", nombre: "LaLiga", abrev: "LL", color: "#EE8707", activa: true },
  { clave: "serie_a", nombre: "Serie A", abrev: "SA", color: "#024494", activa: true },
  { clave: "ligue_1", nombre: "Ligue 1", abrev: "L1", color: "#091C3E", activa: true },
  { clave: "bundesliga", nombre: "Bundesliga", abrev: "BL", color: "#D3010C", activa: true },
  { clave: "championship", nombre: "Championship", abrev: "CH", color: "#00A650", activa: true },
];

let ligaSeleccionada = "todas";

function renderGridLigas() {
  document.getElementById("grid-ligas").innerHTML = LIGAS_DISPONIBLES.map(liga => `
    <button class="liga-box ${!liga.activa ? 'liga-proximamente' : ''} ${ligaSeleccionada === liga.clave ? 'liga-activa-seleccionada' : ''}"
            onclick="${liga.activa ? `seleccionarLiga('${liga.clave}')` : ''}">
      <div class="liga-escudo" style="background:${liga.color}">${liga.abrev}</div>
      <div class="liga-nombre">${liga.nombre}</div>
      ${!liga.activa ? '<div class="liga-badge-proximamente">Próximamente</div>' : ''}
    </button>
  `).join("");
}

async function seleccionarLiga(liga) {
  ligaSeleccionada = liga;
  cerrarMenuLateral();
  await mostrarVistaLiga(liga);
}

async function mostrarVistaLiga(liga) {
  cambiarVista("liga");

  const infoLiga = LIGAS_DISPONIBLES.find(l => l.clave === liga);
  document.getElementById("liga-titulo").textContent = infoLiga ? infoLiga.nombre : liga;
  document.getElementById("liga-escudo-titulo").style.background = infoLiga ? infoLiga.color : "#4E9868";
  document.getElementById("liga-escudo-titulo").textContent = infoLiga ? infoLiga.abrev : "";

  document.getElementById("liga-tabla-posiciones").innerHTML = `<div class="cargando-liga">Cargando tabla de posiciones...</div>`;
  document.getElementById("liga-tabla-goleadores").innerHTML = `<div class="cargando-liga">Cargando goleadores...</div>`;
  document.getElementById("liga-resultados").innerHTML = `<div class="cargando-liga">Cargando resultados...</div>`;
  document.getElementById("liga-proximos").innerHTML = `<div class="cargando-liga">Cargando próximos partidos...</div>`;

  const [{ data: posiciones }, { data: goleadores }, { data: calendario }] = await Promise.all([
    sb.from("tabla_posiciones").select("*").eq("liga", liga).order("posicion", { ascending: true }),
    sb.from("goleadores").select("*").eq("liga", liga).order("posicion", { ascending: true }),
    sb.from("calendario_liga").select("*").eq("liga", liga).order("fecha", { ascending: true }),
  ]);

  document.getElementById("liga-tabla-posiciones").innerHTML = renderTablaPosiciones(posiciones || []);
  document.getElementById("liga-tabla-goleadores").innerHTML = renderTablaGoleadores(goleadores || []);

  const calendarioLista = calendario || [];
  const resultados = calendarioLista.filter(p => p.estado === "finalizado").sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  const proximos = calendarioLista.filter(p => p.estado === "programado").sort((a,b) => new Date(a.fecha) - new Date(b.fecha));

  document.getElementById("liga-resultados").innerHTML = renderResultados(resultados);
  document.getElementById("liga-proximos").innerHTML = renderProximos(proximos);
}

function renderResultados(filas) {
  if (filas.length === 0) return `<div class="cargando-liga">Todavía no hay resultados recientes disponibles.</div>`;
  return `<div class="lista-partidos">${filas.map(p => `
    <div class="partido-item">
      <span class="partido-fecha">${formatearFecha(p.fecha)}</span>
      <div class="partido-equipos">
        <span>${p.escudo_local ? `<img src="${p.escudo_local}" class="partido-escudo" alt="">` : ""}${p.local}</span>
        <span class="partido-marcador">${p.goles_local} - ${p.goles_visitante}</span>
        <span>${p.visitante}${p.escudo_visitante ? `<img src="${p.escudo_visitante}" class="partido-escudo" alt="">` : ""}</span>
      </div>
    </div>
  `).join("")}</div>`;
}

function renderProximos(filas) {
  if (filas.length === 0) return `<div class="cargando-liga">Todavía no hay próximos partidos programados.</div>`;
  return `<div class="lista-partidos">${filas.map(p => `
    <div class="partido-item">
      <span class="partido-fecha">${formatearFecha(p.fecha)}</span>
      <div class="partido-equipos">
        <span>${p.escudo_local ? `<img src="${p.escudo_local}" class="partido-escudo" alt="">` : ""}${p.local}</span>
        <span class="partido-vs-mini">vs</span>
        <span>${p.visitante}${p.escudo_visitante ? `<img src="${p.escudo_visitante}" class="partido-escudo" alt="">` : ""}</span>
      </div>
    </div>
  `).join("")}</div>`;
}

function renderTablaPosiciones(filas) {
  if (filas.length === 0) return `<div class="cargando-liga">Todavía no hay datos de posiciones disponibles.</div>`;
  return `
    <table class="tabla-liga">
      <thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>Pts</th></tr></thead>
      <tbody>
        ${filas.map(f => `
          <tr>
            <td>${f.posicion}</td>
            <td class="celda-equipo">${f.escudo_url ? `<img src="${f.escudo_url}" alt="">` : ""}${f.equipo}</td>
            <td>${f.jugados}</td><td>${f.ganados}</td><td>${f.empatados}</td><td>${f.perdidos}</td>
            <td>${f.diferencia > 0 ? "+" : ""}${f.diferencia}</td>
            <td><b>${f.puntos}</b></td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

function renderTablaGoleadores(filas) {
  if (filas.length === 0) return `<div class="cargando-liga">Todavía no hay datos de goleadores disponibles.</div>`;
  return `
    <table class="tabla-liga">
      <thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>Goles</th></tr></thead>
      <tbody>
        ${filas.map(f => `
          <tr>
            <td>${f.posicion}</td>
            <td>${f.jugador}</td>
            <td class="celda-equipo">${f.escudo_url ? `<img src="${f.escudo_url}" alt="">` : ""}${f.equipo}</td>
            <td><b>${f.goles}</b></td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

function abrirMenuLateral() {
  document.getElementById("menu-lateral").classList.add("abierto");
  document.getElementById("fondo-menu-lateral").classList.add("visible");
}

function cerrarMenuLateral() {
  document.getElementById("menu-lateral").classList.remove("abierto");
  document.getElementById("fondo-menu-lateral").classList.remove("visible");
}

function toggleSubmenuLigas() {
  const submenu = document.getElementById("submenu-ligas");
  const abierto = submenu.style.display !== "none";
  submenu.style.display = abierto ? "none" : "block";
  document.getElementById("flecha-ligas").textContent = abierto ? "▾" : "▴";
}

function cambiarVista(vista) {
  document.getElementById("menu-picks").classList.toggle("activo", vista === "picks");
  document.getElementById("menu-historial").classList.toggle("activo", vista === "historial");
  document.getElementById("vista-picks").style.display = vista === "picks" ? "block" : "none";
  document.getElementById("vista-historial").style.display = vista === "historial" ? "block" : "none";
  document.getElementById("vista-liga").style.display = vista === "liga" ? "block" : "none";

  if (vista === "historial" && !historialYaCargado) {
    historialYaCargado = true;
    cargarHistorialCombinadas();
  }
}

function crearTarjetaCombinadaHistorial(c) {
  let clase = "pendiente", icono = "⏳", claseIcono = "icono-pendiente";
  if (c.resultado === "Cumplida") { clase = ""; icono = "✓"; claseIcono = "icono-cumplida"; }
  else if (c.resultado === "Fallada") { clase = ""; icono = "✕"; claseIcono = "icono-fallada"; }

  const partidos = Array.isArray(c.partidos_json) ? c.partidos_json : [];
  const filasPartidos = partidos.map(p => `<b>${p.local} vs ${p.visitante}</b> — ${p.pick_recomendado}`).join(" · ");
  const tipo = c.es_gratis ? "Gratis" : "VIP";

  return `
    <div class="combinada-card ${clase}">
      <div class="icono-resultado ${claseIcono}">${icono}</div>
      <div class="combinada-detalle">
        <div class="combinada-partidos-mini">${filasPartidos}</div>
        <div class="combinada-meta">
          <span class="badge-tipo">${tipo}</span>
          <span class="cuota-mini">cuota ${c.cuota_combinada}</span>
        </div>
      </div>
    </div>
  `;
}

async function cargarHistorialCombinadas() {
  const contenedor = document.getElementById("contenedor-fechas");
  const resumenCont = document.getElementById("resumen-historial-contenedor");
  try {
    const datos = window._historialCombinadasCache || [];

    if (!datos.length) {
      contenedor.innerHTML = `<div class="vacio">Todavía no hay combinadas registradas. Vuelve después de la primera fecha.</div>`;
      resumenCont.innerHTML = "";
      return;
    }

    const resueltas = datos.filter(d => d.resultado === "Cumplida" || d.resultado === "Fallada");
    if (resueltas.length > 0) {
      const cumplidas = resueltas.filter(d => d.resultado === "Cumplida").length;
      const porcentaje = Math.round((cumplidas / resueltas.length) * 100);
      // Igual que el marcador de la portada: por debajo del umbral, esta
      // seccion se queda oculta -- se muestra sola en cuanto el acierto
      // real suba lo suficiente.
      if (porcentaje >= UMBRAL_TRACK_RECORD_VISIBLE) {
        resumenCont.innerHTML = `
          <div class="marcador-global" style="margin-top:0;">
            <div class="marcador-box">
              <span class="marcador-numero">${porcentaje}<span style="font-size:20px;">%</span></span>
              <span class="marcador-texto"><strong>${cumplidas} de ${resueltas.length}</strong> combinadas cumplidas — historial 100% real y verificable.</span>
            </div>
          </div>`;
      } else {
        resumenCont.innerHTML = "";
      }
    } else {
      resumenCont.innerHTML = "";
    }

    const grupos = {};
    for (const fila of datos) {
      const n = fila.numero_fecha;
      if (!grupos[n]) grupos[n] = [];
      grupos[n].push(fila);
    }
    const numerosFecha = Object.keys(grupos).map(Number).sort((a, b) => b - a);

    // Plegado en pestañas por Fecha, para que la lista no se amontone a
    // medida que se acumulan mas jornadas -- solo la mas reciente arranca
    // abierta, el resto se despliega al hacer click en su titulo.
    contenedor.innerHTML = numerosFecha.map((n, i) => {
      const combinadasDeEstaFecha = grupos[n];
      const cumplidas = combinadasDeEstaFecha.filter(c => c.resultado === "Cumplida").length;
      const falladas = combinadasDeEstaFecha.filter(c => c.resultado === "Fallada").length;
      const resumen = (cumplidas + falladas) > 0 ? `${cumplidas}✓ / ${falladas}✕` : "pendiente";
      return `
      <div class="fecha-grupo ${i === 0 ? "abierto" : ""}">
        <button class="fecha-titulo" onclick="this.parentElement.classList.toggle('abierto')">
          <span>Fecha ${n}</span>
          <span class="fecha-titulo-resumen">${resumen} <span class="fecha-titulo-flecha">▾</span></span>
        </button>
        <div class="fecha-combinadas">
          ${combinadasDeEstaFecha.map(crearTarjetaCombinadaHistorial).join("")}
        </div>
      </div>
    `;
    }).join("");
  } catch (err) {
    contenedor.innerHTML = `<div class="vacio">No se pudo cargar el historial todavía. Intenta de nuevo más tarde.</div>`;
    console.error(err);
  }
}

(async function iniciar() {
  renderGridLigas();
  await actualizarSesion();
  await cargarTodo();
  await verificarRetornoDePago();
  sb.auth.onAuthStateChange((_evento, session) => { aplicarSesion(session); cargarTodo(); });

  // Limpieza de seguridad: si quedo un "#" suelto en la URL (residuo de
  // un login anterior), lo quitamos para que nunca se acumule con el
  // proximo "#access_token=..." que agregue Supabase.
  if (window.location.hash) {
    setTimeout(() => {
      history.replaceState(null, "", window.location.pathname);
    }, 500);
  }
})();
</script>
